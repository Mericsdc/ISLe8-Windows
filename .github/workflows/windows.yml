# Windows'ta derleme denetimi. Yalnızca elle çalışır (GitHub › Actions › windows › Run workflow),
# böylece özel reponun Actions dakikaları her push'ta harcanmaz. Sürüm yayını: release.yml.
name: windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core testleri
        if: matrix.platform == 'x64'
        run: dotnet test tests/ISLe8.Core.Tests -c Release

      - name: Derle (paketsiz)
        run: dotnet build src/ISLe8.App -c Release -p:Platform=${{ matrix.platform }} -p:Unpackaged=true

      - name: Native AOT ile yayınla
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./scripts/publish.ps1 -Platform x64

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x64'
        with:
          name: ISLe8-win-x64
          path: artifacts/*.zip
