# Sürüm yayını. "v" ile başlayan bir etiket gönderilince (git tag v0.1.0 && git push origin v0.1.0)
# x64 ve ARM64 için Native AOT ile derler, zip'leri o etiketin GitHub Release'ine koyar. Elle de
# çalışır (Actions › release › Run workflow): etiket yoksa bu commit'te oluşturulur.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Yayınlanacak etiket, ör. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core testleri
        run: dotnet test tests/ISLe8.Core.Tests -c Release

      - name: x64 (Native AOT)
        shell: pwsh
        run: ./scripts/publish.ps1 -Platform x64

      # ARM64, x64 makinede çapraz derleniyor; olmazsa x64 yine yayınlanır.
      - name: ARM64 (Native AOT)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/publish.ps1 -Platform ARM64

      - uses: actions/upload-artifact@v4
        with:
          name: ISLe8-${{ env.TAG }}
          path: artifacts/*.zip

      - name: GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = (Get-ChildItem artifacts/*.zip).FullName
          $notes = @'
          ## Kurulum

          1. İşlemcine uyan zip'i indir: çoğu bilgisayar için **win-x64**, Snapdragon / ARM bilgisayarlar için **win-arm64**.
          2. Zip'i bir klasöre çıkar (ör. `Belgeler\ISLe8`) ve **ISLe8.exe**'yi çalıştır. Kurulum ya da .NET gerekmez.
          3. Windows "Windows kişisel bilgisayarınızı korudu" derse: **Ek bilgi › Yine de çalıştır** (uygulama henüz imzalı değil).

          Ada ekranın üst ortasında durur; üzerine gelince açılır. Kapatmak için adaya sağ tıkla › **ISLe8'den çık**.
          Gereken: Windows 10 2004+ ya da Windows 11.
          '@
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @zips --clobber
          } else {
            gh release create $env:TAG @zips --target $env:GITHUB_SHA --title "ISLe8 for Windows $env:TAG" --notes $notes
          }
